# Memory Haven — API Railway
# Root Directory : VIDE (racine repo) → utilise /Dockerfile
# Si Root Directory = backend → utilise backend/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
