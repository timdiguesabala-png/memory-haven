# Root Directory Railway : laisser VIDE (racine du repo). Voir nixpacks.toml
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd backend && (node prisma/seed.js || true) && node src/app.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
