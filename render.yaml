# Memory Haven — API sur Render + base Supabase (sans Railway)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: memory-haven-api
    runtime: node
    rootDir: backend
    plan: free
    # Ne pas lancer prisma db push : le schéma Supabase est géré par supabase/migrations/*.sql
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    # / ne teste pas la BDD — évite échec deploy si DATABASE_URL pas encore OK
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: memory-haven
      - key: FRONTEND_URL
        value: https://memory-haven-frontend.vercel.app
      - key: PUBLIC_API_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
